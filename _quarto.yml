  # Barra lateral propia de la sección del marco teórico: es el único bloque
  # del sitio con varias páginas encadenadas, y da navegación anterior/siguiente.
  sidebar:
    - title: "Marco teórico"
      style: floating
      collapse-level: 2
      contents:
        - href: contenido/planteamiento/marco-teorico/index.md
          text: Presentación
        - href: contenido/planteamiento/marco-teorico/01-biologia.md
          text: "1 · Biología"
        - href: contenido/planteamiento/marco-teorico/02-metodos-computacionales.md
          text: "2 · Métodos computacionales"
        - href: contenido/planteamiento/marco-teorico/03-modelado-y-explicabilidad.md
          text: "3 · Modelado y explicabilidad"

  page-footer:
    center: |
      Equipo 7 · Maestría en Inteligencia Artificial Aplicada (TC5035.10) · Tecnológico de Monterrey

format:
  html:
    # Quarto trata el slot `light` como predeterminado y su esquema está cerrado
    # a esas dos llaves: no hay bandera de "oscuro por defecto". Intercambiarlos
    # sí arranca en oscuro, pero desincroniza el resaltado de sintaxis (el tema
    # alterno termina con tokens claros sobre fondo blanco). En vez de eso,
    # `respect-user-color-scheme` hace que manden las preferencias del sistema:
    # quien tiene el SO en oscuro ve el sitio en oscuro.
    theme:
      light: [flatly, estilos.scss]
      dark: [darkly, estilos.scss]
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    code-fold: show
    code-tools: false
    code-overflow: wrap
    fig-align: center
    df-print: paged
    link-external-newwindow: true
    smooth-scroll: true

bibliography: docs/referencias/bibliografia.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl
respect-user-color-scheme: true
citations-hover: true
link-citations: true
lang: es

execute:
  freeze: true      # usa las salidas guardadas del notebook; no lo reejecuta
  enabled: false
