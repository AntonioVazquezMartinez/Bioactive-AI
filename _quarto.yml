    type: overlay
    copy-button: true
  back-to-top-navigation: true

  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: contenido/glosario.md
        text: Glosario
      - text: Marco teórico
        menu:
          - href: contenido/planteamiento/marco-teorico/index.md
            text: Presentación
          - href: contenido/planteamiento/marco-teorico/01-biologia.md
            text: "1 · Biología de la barrera y de la enfermedad"
          - href: contenido/planteamiento/marco-teorico/02-metodos-computacionales.md
            text: "2 · Métodos computacionales"
          - href: contenido/planteamiento/marco-teorico/03-modelado-y-explicabilidad.md
            text: "3 · Modelado, explicabilidad y hueco"
      - text: Investigación
        menu:
          - href: contenido/referencias/index.md
            text: Índice
          - href: contenido/referencias/01-representaciones-moleculares.md
            text: "01 · Representaciones moleculares"
          - href: contenido/referencias/02-datasets-bbb.md
            text: "02 · Datasets de BBB"
          - href: contenido/referencias/03-explicabilidad.md
            text: "03 · Explicabilidad"
          - href: contenido/referencias/04-datos-neuroactividad.md
            text: "04 · Datos de neuroactividad"
          - href: contenido/referencias/05-fuentes-de-datos.md
            text: "05 · Fuentes de datos"
      - text: Análisis
