project:
  type: website
  output-dir: _site
  pre-render: python3 scripts/prepare_site.py
  # Quarto no copia por su cuenta lo que una etiqueta <script src> referencia.
  # `recursos/` lleva los datos y el código de las páginas interactivas.
  resources:
    - recursos/
  render:
    - index.qmd
    - visualizador.qmd
    - presentacion.qmd
    - consulta.qmd
    - bibliografia.qmd
    - contenido/**/*.md
    - contenido/**/*.qmd
    - contenido/notebooks/01_EDA.ipynb
    - contenido/notebooks/01b_EDA_actividad_snc.ipynb
    - contenido/notebooks/02_Feature_Eng.ipynb
    - contenido/notebooks/02b_Feature_Eng_actividad.ipynb
    - contenido/notebooks/03_Baseline.ipynb
    - contenido/notebooks/03b_Baseline_regresion_actividad.ipynb
    - contenido/notebooks/03c_Permeabilidad_huellas.ipynb
    - contenido/notebooks/04_Models.ipynb
    - contenido/notebooks/04b_Regresion_actividad.ipynb
    - contenido/notebooks/04c_Regresion_actividad_huellas.ipynb
    - contenido/notebooks/05b_Ensambles_actividad.ipynb

