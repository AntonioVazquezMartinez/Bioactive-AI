name: Publicar sitio

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "notebooks/**"
      - "data/external/README.md"
      - "index.qmd"
      - "bibliografia.qmd"
      - "_quarto.yml"
      - "scripts/prepare_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Un solo despliegue a la vez; los intermedios se descartan.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar el contenido
        # Quarto arma su lista de archivos antes del pre-render, así que
        # contenido/ debe existir para que lo detecte.
        run: python3 scripts/prepare_site.py

      - name: Renderizar
        # Los notebooks NO se reejecutan: se publican con las salidas guardadas
        # (execute.enabled false en _quarto.yml). Por eso el job no necesita
        # RDKit ni el resto del entorno de análisis.
        run: quarto render

      - name: Verificar enlaces internos
        run: python3 scripts/verificar_sitio.py

      - name: Verificar el registro de decisiones
        run: python3 scripts/verificar_decisiones.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
