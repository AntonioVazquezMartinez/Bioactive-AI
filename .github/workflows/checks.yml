name: Checks

# Corre en cada PR hacia main y en cada push a main. pages.yml solo publica al fusionar,
# así que sin este workflow un PR roto no se detectaba hasta después de fusionarlo.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sitio:
    name: Sitio y decisiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar el contenido
        run: python3 scripts/prepare_site.py

      - name: Renderizar
        # Los notebooks no se reejecutan (execute.enabled false en _quarto.yml).
        run: quarto render

      - name: Verificar enlaces internos
        run: python3 scripts/verificar_sitio.py

      - name: Verificar el registro de decisiones
        run: python3 scripts/verificar_decisiones.py

  codigo:
    name: Ruff y pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Instalar el entorno del lock
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Ruff
        run: ruff check

      - name: Pruebas
        run: pytest
